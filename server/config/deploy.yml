# Name of your application. Used to uniquely configure containers.
service: phototherapy_server

# Name of the container image (use your-user/app-name on external registries).
image: phototherapy_server

# Deploy to these servers.
# Host: ami (Arch multi-app Kamal host) — see docs/deploy-ami.md
servers:
  web:
    hosts:
      - 192.168.1.202
    # HTTP only via kamal-proxy. UDP discovery is the host-network accessory
    # below (broadcast + real client IPs). See docs/deploy-ami.md.

# LAN multi-app via kamal-proxy (HTTP on host :80). No Let's Encrypt on LAN.
# Point clients at phototherapy.ami.lan (or add /etc/hosts → 192.168.1.202).
proxy:
  host: phototherapy.ami.lan
  # ssl: true   # enable only with a public DNS name reachable for ACME

# Local registry (Kamal starts it on the deploy machine and SSH-tunnels to hosts).
registry:
  server: localhost:5555

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    SOLID_QUEUE_IN_PUMA: true

    # Web process does not bind UDP — accessory `udp_discovery` does (host net).
    UDP_DISCOVERY: "0"

# UDP JSON discovery on the host network stack so ESP broadcast + unicast both
# reach the listener and peer addresses stay real LAN IPs (not docker-proxy).
# Same image/volume as web. After app deploy: bin/kamal accessory reboot udp_discovery
accessories:
  udp_discovery:
    host: 192.168.1.202
    # Same registry as app image (local registry tunnelled by Kamal).
    image: localhost:5555/phototherapy_server:latest
    network: host
    cmd: 'bin/rails runner "UdpDiscoveryListener.start!; sleep"'
    env:
      secret:
        - RAILS_MASTER_KEY
      clear:
        UDP_DISCOVERY: "1"
        UDP_DISCOVERY_IDENTITY: ami
        UDP_DISCOVERY_IP: "192.168.1.202"
        UDP_DISCOVERY_PORT: "3000"
        RAILS_LOG_LEVEL: info
    volumes:
      - "phototherapy_server_storage:/rails/storage"
    options:
      restart: unless-stopped

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent SQLite + Active Storage (back up this volume off-host when it matters).
volumes:
  - "phototherapy_server_storage:/rails/storage"

# Bridge fingerprinted assets between versions.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# Kamal SSH user created by arch-rails-server bootstrap (docker group).
ssh:
  user: deploy
